name: Lint

on:
  push:
    branches: [main, dev]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Python 3.14
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up backend
        uses: ./.github/actions/setup-python
        with:
          groups: dev
      - name: Validate pre-commit configuration
        run: poetry run pre-commit validate-config ../.pre-commit-config.yaml
      - name: Check Python
        run: poetry run ruff check . ../docs/_ext
      - name: Check Python formatting
        run: poetry run ruff format --check . ../docs/_ext

  frontend:
    name: TypeScript on Node.js 22
    runs-on: ubuntu-latest
    timeout-minutes: 10
    defaults:
      run:
        working-directory: frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up frontend
        uses: ./.github/actions/setup-node
      - name: Check TypeScript
        run: npm run lint
