name: Documentation

on:
  push:
    branches: [main]
  # Built on pull requests too, so a broken cross-reference is caught before it
  # reaches main. Only the push builds are deployed.
  pull_request:
  workflow_dispatch:

# The published site is a single deployment target. Cancelling a superseded run
# rather than queueing it keeps the live site matching the newest commit. Scoped
# by ref so a pull-request build cannot cancel an in-flight deploy from main.
concurrency:
  group: pages-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  build:
    name: Build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
      - name: Set up backend
        uses: ./.github/actions/setup-python
        with:
          groups: docs

      # -W turns warnings into errors, so a broken cross-reference or a stale
      # autodoc target fails here rather than publishing a page with a dead
      # link in it.
      - name: Sphinx
        run: poetry run sphinx-build -b html -W --keep-going ../docs ../docs/_build/html

      - name: Upload GitHub Pages artifact
        uses: actions/upload-pages-artifact@v5
        with:
          path: docs/_build/html

  deploy:
    name: Deploy to GitHub Pages
    needs: build
    if: github.event_name != 'pull_request'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v5
