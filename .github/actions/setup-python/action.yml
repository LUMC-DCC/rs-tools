name: Set up Python and Poetry
description: Install Python, Poetry, and the backend with the requested dependency groups.

inputs:
  python-version:
    description: Python version to install.
    required: false
    default: "3.14"
  groups:
    description: Comma-separated Poetry dependency groups to install alongside the main ones.
    required: false
    default: ""

runs:
  using: composite
  steps:
    - uses: actions/setup-python@v7
      with:
        python-version: ${{ inputs.python-version }}

    - name: Install Poetry
      shell: bash
      run: pipx install poetry

    # Keyed on the lock file, so a dependency change invalidates the cache and
    # anything else reuses it.
    - uses: actions/cache@v6
      with:
        path: ~/.cache/pypoetry
        key: poetry-${{ runner.os }}-py${{ inputs.python-version }}-${{ hashFiles('backend/poetry.lock') }}
        restore-keys: poetry-${{ runner.os }}-py${{ inputs.python-version }}-

    - name: Install project
      shell: bash
      working-directory: backend
      run: |
        if [ -n "${{ inputs.groups }}" ]; then
          poetry install --no-interaction --with "${{ inputs.groups }}"
        else
          poetry install --no-interaction
        fi
